<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6f3ee">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>Nido · Simulación</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght,SOFT,WONK@9..144,600,100,0&display=swap">
<style>
/* Layout: una sola app de tablet (máx. 1194 px) que pasa de pantalla en pantalla; columnas que se apilan en móvil. Aspecto único claro, a propósito. */
:root{
  --lino:#f6f3ee; --papel:#fdfcfa; --arena:#f3e7d6; --linea:#e6d8c4; --borde:#958572;
  --tinta:#24283b; --tinta-suave:#5b5e6e;
  --salvia-viva:#5e8a5a; --salvia-viva-oscura:#42663f; --sobre-salvia:#fffdf9;
  --salvia:#a6b8a3; --salvia-suave:#cfd4c2; --salvia-oscura:#687b67; --salvia-niebla:#e9ece3;
  --verde-voz:#2f7a4d; --verde-voz-oscuro:#1f5a37; --verde-halo:#cfe8d6; --verde-halo-suave:#e6f3e9;
  --durazno:#e8b597; --durazno-suave:#f5dcc6; --terracota:#cf9470; --terracota-oscura:#8f5232;
  --cielo-suave:#e3e9f2; --cielo-oscuro:#34466a; --cielo-niebla:#eef2f7;
  --dorado:#e2a93f; --dorado-suave:#fbe7c2; --dorado-oscuro:#6b4c10; --luz-dorada:#fdecc8;
  --rama:#8a6a48; --rama-clara:#b39572;
  --f-titulo:'Fraunces',Georgia,'Times New Roman',serif;
  --f-texto:'Atkinson Hyperlegible',Verdana,system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--lino);color:var(--tinta);font-family:var(--f-texto);font-size:20px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--tinta);outline-offset:4px}
h1,h2,p{margin:0}
.titulo{font-family:var(--f-titulo);font-variation-settings:"SOFT" 100,"WONK" 0;font-weight:600;text-wrap:balance}

.app{position:relative;max-width:1194px;min-height:min(834px,calc(100vh - 32px));margin:0 auto;border-radius:28px;overflow:hidden;
  background-color:var(--lino);
  background-image:radial-gradient(55% 40% at 10% 0%,var(--durazno-suave),transparent 70%),radial-gradient(50% 40% at 90% 4%,var(--luz-dorada),transparent 72%),radial-gradient(70% 50% at 50% 108%,var(--salvia-niebla),transparent 70%);
  box-shadow:0 1px 2px rgba(36,40,59,.06),0 12px 40px rgba(36,40,59,.08)}
.pantalla{min-height:inherit;padding:20px clamp(16px,4vw,48px) 28px;display:flex;flex-direction:column;gap:20px}
.ilus{display:block;max-width:100%;height:auto;user-select:none;pointer-events:none}

/* barra */
.barra{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.marca{font-family:var(--f-titulo);font-variation-settings:"SOFT" 100,"WONK" 0;font-weight:600;font-size:28px}
.txt-btn{background:none;border:0;min-height:56px;padding:0 8px;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:19px;text-decoration:underline;text-underline-offset:6px}
.txt-btn svg{width:24px;height:24px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;background:var(--durazno-suave);color:var(--terracota-oscura);font-weight:700;font-size:18px}
.chip svg{width:22px;height:22px}

/* botones */
.boton{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:64px;padding:0 30px;border-radius:16px;border:3px solid transparent;font-weight:700;font-size:22px;line-height:1.2;transition:transform .12s,box-shadow .12s}
.boton svg{width:26px;height:26px;flex:none}
.boton.primario{background:var(--salvia-viva);color:var(--sobre-salvia);box-shadow:0 4px 0 var(--salvia-viva-oscura)}
.boton.primario:active{transform:translateY(4px);box-shadow:none;background:var(--salvia-viva-oscura)}
.boton.secundario{background:var(--papel);border-color:var(--salvia-viva)}
.boton.secundario:active{background:var(--salvia-niebla)}
.boton.grande{min-height:80px;font-size:24px;padding:0 40px}
.escuchar{width:64px;height:64px;border-radius:50%;flex:none;background:var(--papel);border:3px solid var(--borde);display:inline-grid;place-items:center}
.escuchar svg{width:30px;height:30px}
.escuchar.sonando{background:var(--salvia-niebla);border-color:var(--salvia-oscura)}

/* voz */
.voz{display:flex;flex-direction:column;align-items:center;gap:10px}
.voz-btn{width:112px;height:112px;border-radius:50%;border:0;background:var(--verde-voz);color:#fffcf6;box-shadow:0 4px 0 var(--verde-voz-oscuro);display:grid;place-items:center}
.voz-btn svg{width:48px;height:48px}
.voz.escuchando .voz-btn{transform:translateY(4px);box-shadow:0 0 0 10px var(--verde-halo),0 0 0 20px var(--verde-halo-suave)}
@media (prefers-reduced-motion:no-preference){.voz.escuchando .voz-btn{animation:respira 2.4s ease-in-out infinite}}
@keyframes respira{50%{box-shadow:0 0 0 14px var(--verde-halo),0 0 0 28px var(--verde-halo-suave)}}
.voz-rotulo{font-weight:700;font-size:21px}
.ayuda{font-size:18px;color:var(--tinta-suave)}

/* bienvenida e inicio */
.centro{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center}
.saludo{font-size:clamp(40px,6vw,58px);line-height:1.05}
.lema{font-size:24px;color:var(--tinta-suave)}
.lema2{font-family:var(--f-titulo);font-variation-settings:"SOFT" 100,"WONK" 0;font-size:20px;color:var(--terracota-oscura);font-style:italic}
.inicio{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px;align-items:center;flex:1}
.inicio-izq{display:flex;flex-direction:column;gap:22px}
.saludo-fila{display:flex;align-items:center;gap:20px}
.tarjeta-nido{background:var(--papel);border-radius:32px;padding:20px 24px;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;border:0;text-align:left;box-shadow:0 1px 2px rgba(36,40,59,.06),0 8px 20px rgba(36,40,59,.07)}
.semana{display:flex;flex-direction:column;gap:10px;background:var(--papel);border-radius:24px;padding:16px 20px;box-shadow:0 1px 2px rgba(36,40,59,.06),0 8px 20px rgba(36,40,59,.07)}
.dias{display:flex;gap:8px;list-style:none;padding:0;margin:0}
.dias li{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:17px;color:var(--tinta-suave)}
.dias i{width:40px;height:40px;border-radius:50%;border:2px dashed var(--borde);display:grid;place-items:center;font-style:normal}
.dias li.hecho i{background:var(--salvia-niebla);border:2px solid var(--salvia-oscura);color:var(--salvia-oscura)}
.dias li.hoy{color:var(--tinta);font-weight:700}
.dias svg{width:20px;height:20px}

/* ejercicio */
.puntos{display:flex;align-items:center;gap:12px}
.puntos ol{display:flex;gap:10px;list-style:none;margin:0;padding:0}
.puntos li{width:18px;height:18px;border-radius:50%;background:var(--linea)}
.puntos li.hecho{background:var(--salvia)}
.puntos li.ayuda{background:var(--dorado)}
.puntos li.actual{background:var(--papel);box-shadow:inset 0 0 0 3px var(--tinta)}
.puntos span{font-size:18px;color:var(--tinta-suave)}
.ejercicio{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center}
.foto{width:min(100%,400px);aspect-ratio:1;justify-self:center;border-radius:32px;background:var(--arena);display:grid;place-items:center;position:relative;transition:box-shadow .3s}
.foto .emo{font-size:clamp(110px,15vw,180px);line-height:1}
.foto.acierto{box-shadow:0 0 0 4px var(--cielo-oscuro)}
.foto .marca-ok{position:absolute;top:14px;right:14px;width:48px;height:48px;border-radius:50%;background:var(--cielo-oscuro);color:var(--papel);display:grid;place-items:center}
.foto .marca-ok svg{width:28px;height:28px}
.foto .provisional{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:15px;color:var(--tinta-suave)}
.lado{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.lino-mini{width:auto;max-width:min(240px,70%);height:118px;object-fit:contain}
.pregunta{display:flex;align-items:center;gap:14px;justify-content:center;flex-wrap:wrap}
.pregunta h2{font-size:clamp(26px,3.2vw,32px);line-height:1.25;font-weight:700}
.fila{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.opciones{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:16px;width:100%}
.opcion{min-height:96px;padding:16px;border-radius:24px;background:var(--papel);border:3px solid var(--borde);box-shadow:0 4px 0 var(--borde);font-weight:700;font-size:clamp(24px,2.8vw,30px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.opcion .emo{font-size:clamp(70px,10vw,110px);line-height:1.1}
.opcion:active{transform:translateY(4px);box-shadow:none}
.opcion.ok{background:var(--cielo-suave);border-color:var(--cielo-oscuro);box-shadow:0 4px 0 var(--cielo-oscuro)}
.opcion.fuera{opacity:.4;box-shadow:none}
.pista{display:flex;align-items:center;gap:16px;padding:16px 20px;border-radius:24px;background:var(--dorado-suave);color:var(--dorado-oscuro);width:100%;justify-content:center;flex-wrap:wrap}
.pista .pasos{display:flex;gap:6px}
.pista .pasos i{width:14px;height:14px;border-radius:50%;border:2px solid var(--dorado-oscuro)}
.pista .pasos i.si{background:var(--dorado-oscuro)}
.pista b{font-size:40px;line-height:1;color:var(--tinta);letter-spacing:.04em}
.mensaje{display:flex;flex-direction:column;gap:4px;padding:14px 22px;border-radius:24px;width:100%}
.mensaje.bien{background:var(--cielo-suave)}
.mensaje.bien .titulo{color:var(--cielo-oscuro)}
.mensaje.casi{background:var(--luz-dorada)}
.mensaje.casi .titulo{color:var(--dorado-oscuro)}
.mensaje.juntos{background:var(--arena)}
.mensaje .titulo{font-size:30px;line-height:1.15}
.palabra-grande{font-size:clamp(40px,6vw,56px);font-weight:700;letter-spacing:.02em}
.completar{font-size:clamp(40px,6vw,56px);font-weight:700;letter-spacing:.08em}
.completar u{text-decoration:none;display:inline-block;min-width:2.2ch;border-bottom:5px solid var(--terracota);color:var(--terracota-oscura)}
.nota{font-size:16px;color:var(--tinta-suave);max-width:36ch}
.hop{animation:hop .6s ease}
@keyframes hop{35%{transform:translateY(-14px) rotate(-3deg)}}

.bloques-zona{display:flex;flex-direction:column;gap:10px}
.bloques{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.bloque{position:relative;display:flex;align-items:center;gap:14px;min-height:96px;padding:14px 16px;border-radius:26px;border:3px solid transparent;text-align:left;
  background-color:var(--w0);background-image:radial-gradient(80% 110% at 0% 0%,var(--w1),transparent 70%),radial-gradient(70% 100% at 100% 100%,var(--w2),transparent 68%)}
.bloque:hover{border-color:var(--tinta)}
.bloque:active{transform:translateY(2px)}
.bloque-ico{width:56px;height:56px;border-radius:50%;background:var(--papel);display:grid;place-items:center;flex:none;color:var(--ic)}
.bloque-ico svg{width:30px;height:30px}
.bloque-txt{display:flex;flex-direction:column;min-width:0}
.bloque-nombre{font-family:var(--f-titulo);font-variation-settings:"SOFT" 100,"WONK" 0;font-weight:600;font-size:22px;line-height:1.2}
.bloque-desc{font-size:16px;color:var(--tinta-suave)}
.pronto{position:absolute;top:-10px;right:12px;font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--papel);color:var(--tinta-suave);border:2px solid var(--linea)}
.bloque-den{--w0:var(--durazno-suave);--w1:var(--durazno);--w2:var(--luz-dorada);--ic:var(--terracota-oscura)}
.bloque-sem{--w0:var(--luz-dorada);--w1:var(--dorado-suave);--w2:var(--durazno-suave);--ic:var(--dorado-oscuro)}
.bloque-sin{--w0:var(--salvia-niebla);--w1:var(--salvia-suave);--w2:var(--durazno-suave);--ic:var(--salvia-viva-oscura)}
.bloque-otr{--w0:var(--cielo-niebla);--w1:var(--cielo-suave);--w2:var(--salvia-niebla);--ic:var(--cielo-oscuro)}
/* bloques nuevos */
.ejercicio.ancho{grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr)}
.repite{font-size:clamp(34px,5vw,52px);font-weight:700;line-height:1.15;text-align:center;padding:0 20px;letter-spacing:.02em}
.frase-hueco{font-size:clamp(26px,3.4vw,34px);font-weight:700;line-height:1.3}
.frase-hueco u{text-decoration:none;display:inline-block;min-width:4ch;border-bottom:5px solid var(--terracota);color:var(--terracota-oscura);padding:0 .15em}
.opcion.txt{font-size:clamp(22px,2.4vw,26px);min-height:80px;line-height:1.25}
.opciones.una{grid-template-columns:1fr}
.opcion .lbl{font-size:18px;font-weight:700;color:var(--tinta-suave)}
.huecos{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;min-height:88px;padding:12px;border-radius:22px;background:var(--arena);width:100%}
.hueco{min-width:110px;min-height:60px;border:3px dashed var(--borde);border-radius:14px}
.fichas{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.ficha{min-height:60px;padding:8px 18px;border-radius:14px;background:var(--papel);border:3px solid var(--tinta);font-weight:700;font-size:clamp(20px,2.4vw,24px);box-shadow:0 3px 0 var(--tinta)}
.huecos .ficha{border-color:var(--rama);box-shadow:none}
.huecos .ficha.ok{border-color:var(--cielo-oscuro);background:var(--cielo-suave)}
.huecos.pasos .ficha,.huecos.pasos .hueco{font-size:18px;max-width:180px}
.flecha{font-size:24px;color:var(--tinta-suave)}
.chip svg{width:22px;height:22px}
.pestanas{display:flex;gap:6px;padding:4px;border-radius:16px;background:var(--arena);align-self:flex-start}
.pestana{min-height:48px;padding:0 20px;border-radius:12px;border:0;background:transparent;font-weight:700;font-size:18px}
.pestana.activa{background:var(--papel);box-shadow:0 1px 3px rgba(36,40,59,.12)}
.lista-deseos,.lista-palabras{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.lista-deseos li{display:grid;grid-template-columns:56px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 12px;border-radius:18px;background:var(--lino)}
.lista-deseos .circ{width:56px;height:56px;border-radius:50%;background:var(--arena);display:grid;place-items:center;font-size:28px}
.ld-txt{display:flex;flex-direction:column;min-width:0}
.lista-palabras li{display:grid;grid-template-columns:64px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:8px 10px;border-radius:16px;background:var(--lino)}
.mini-foto{width:64px;height:64px;border-radius:12px;background:var(--arena);overflow:hidden;display:grid;place-items:center;font-size:34px;text-align:center}
.mini-foto img{width:100%;height:100%;object-fit:cover}
.lp-w{font-size:22px;overflow-wrap:anywhere}
.boton.chico{min-height:48px;padding:0 16px;font-size:18px;border-width:2px}
.iconos{display:flex;flex-wrap:wrap;gap:8px}
.ico-op{position:relative}
.ico-op input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.ico-op span{width:52px;height:52px;border-radius:14px;border:3px solid var(--linea);display:grid;place-items:center;font-size:28px;background:var(--papel)}
.ico-op input:checked+span{border-color:var(--tinta);box-shadow:0 0 0 3px var(--papel) inset}
.ico-op input:focus-visible+span{outline:4px solid var(--tinta);outline-offset:3px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.error{color:#8f3a1d;font-weight:700;background:var(--durazno-suave);padding:10px 14px;border-radius:12px}
#fd-nueva{min-height:56px;border-radius:14px;border:2px solid var(--borde);padding:0 16px;font:inherit;background:var(--papel)}
.fotocasa{width:100%;height:100%;object-fit:cover;border-radius:inherit;position:absolute;inset:0}
.opcion .repite{font-size:28px;padding:0}
.fotocasa.mini{position:static;width:min(160px,100%);height:auto;aspect-ratio:1;border-radius:16px}
@media (max-width:560px){.lista-deseos li,.lista-palabras li{grid-template-columns:56px minmax(0,1fr)}}
.capa-caja.ancha{max-width:760px}
.cifras{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.cifras div{background:var(--lino);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column}
.cifras b{font-size:30px;font-variant-numeric:tabular-nums;line-height:1.1}
.cifras span{font-size:15px;color:var(--tinta-suave)}
.tabla-bloques{display:flex;flex-direction:column;gap:10px}
.tb-fila{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 3ch;gap:12px;align-items:center;font-size:17px}
.tb-barra{display:flex;height:14px;border-radius:999px;background:var(--arena);overflow:hidden}
.tb-barra i{display:block;height:100%;background:var(--salvia-viva)}
.tb-barra i.p{background:var(--dorado)}
.tb-n{text-align:right;font-variant-numeric:tabular-nums;color:var(--tinta-suave)}
.leyenda-c{display:inline-block;width:14px;height:14px;border-radius:4px;background:var(--salvia-viva);vertical-align:-2px;margin:0 4px 0 10px}
.leyenda-c.p{background:var(--dorado)}.leyenda-c.j{background:var(--arena)}
.previa summary{cursor:pointer;font-weight:700;font-size:17px}
.previa pre{white-space:pre-wrap;font-family:var(--f-texto);font-size:15px;background:var(--lino);padding:12px;border-radius:12px;max-height:240px;overflow:auto}
.capa-caja hr{border:0;border-top:2px solid var(--linea);margin:4px 0;width:100%}
.voz-pal{display:flex;flex-direction:column;gap:6px}
.voz-pal b{font-size:20px}
.voz-pal ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.voz-pal li{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.voz-pal audio{height:40px;max-width:100%}
@media (max-width:560px){.cifras{grid-template-columns:repeat(2,minmax(0,1fr))}.tb-fila{grid-template-columns:1fr 3ch}.tb-fila .tb-barra{grid-column:1/-1;grid-row:2}}
/* final y nido */
.dos{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:center;flex:1}
.palabras{display:flex;flex-wrap:wrap;gap:10px}
.palabras span{padding:6px 16px;border-radius:999px;background:var(--papel);border:2px solid var(--salvia-viva);font-weight:700;font-size:19px}
.nido-caja{position:relative;width:100%;aspect-ratio:1600/893;max-width:100%}
.nido-caja img,.nido-caja canvas{position:absolute;inset:0;width:100%;height:100%}
.nido-caja canvas{mix-blend-mode:multiply}
.nido-caja img{object-fit:contain}
.leyenda{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;font-size:18px}
.leyenda li{display:flex;align-items:center;gap:10px}
.leyenda i{width:32px;height:6px;border-radius:999px;flex:none}
.deseos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.deseo{display:grid;grid-template-columns:96px minmax(0,1fr);gap:18px;align-items:center;padding:18px;border-radius:24px;background:var(--papel);box-shadow:0 1px 2px rgba(36,40,59,.06),0 8px 20px rgba(36,40,59,.07)}
.deseo .circ{width:96px;height:96px;border-radius:50%;background:var(--arena);display:grid;place-items:center;font-size:48px}
.deseo h3{margin:0;font-family:var(--f-titulo);font-variation-settings:"SOFT" 100,"WONK" 0;font-weight:600;font-size:24px;line-height:1.2}
.deseo .frase{font-weight:700;font-size:18px;margin:4px 0 10px}
.hilos{display:flex;gap:6px}
.hilos i{width:28px;height:6px;border-radius:999px;background:var(--linea)}
.estado{margin-top:6px;font-size:17px;font-weight:700}
.deseo.logrado{background:var(--salvia-niebla)}

/* capas */
.capa{position:absolute;inset:0;z-index:20;display:flex;padding:24px;overflow-y:auto;background:rgba(246,243,238,.94)}
.capa>*{margin:auto}
.capa-caja{background:var(--papel);border-radius:32px;padding:28px;max-width:640px;width:100%;display:flex;flex-direction:column;gap:18px;box-shadow:0 12px 40px rgba(36,40,59,.14)}
.capa-meta{flex-direction:column;gap:16px;text-align:center}
.capa-meta video{width:min(640px,100%);height:auto;mix-blend-mode:multiply}
.capa-meta img{width:min(520px,100%);height:auto}
.campo{display:flex;flex-direction:column;gap:6px}
.campo label,.campo legend{font-weight:700;font-size:18px}
.campo input[type=text]{min-height:56px;border-radius:14px;border:2px solid var(--borde);padding:0 16px;font:inherit;background:var(--lino)}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.radio{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 16px;border-radius:14px;border:2px solid var(--linea);font-size:19px}
.radio input{width:24px;height:24px;accent-color:var(--salvia-viva)}
.radio:has(input:checked){border-color:var(--salvia-viva);background:var(--salvia-niebla)}
.etiqueta{font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-suave)}

/* transición de acuarela */
/* La pantalla nueva aparece dentro de la mancha, que crece desde el centro */
#vista{position:relative;z-index:2;min-height:inherit}
.viejo{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none}
.viejo>.pantalla{min-height:100%}
#vista.revela{background-color:var(--lino);background-image:radial-gradient(55% 40% at 10% 0%,var(--durazno-suave),transparent 70%),radial-gradient(50% 40% at 90% 4%,var(--luz-dorada),transparent 72%),radial-gradient(70% 50% at 50% 108%,var(--salvia-niebla),transparent 70%);
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;will-change:mask-size,-webkit-mask-size}
.tinta{position:absolute;inset:0;z-index:30;pointer-events:none;overflow:hidden;display:grid;place-items:center}
.tinta img{width:100%;height:auto;will-change:transform,opacity;transform:scale(.05)}
@media (prefers-reduced-motion:reduce){.hop{animation:none}.boton,.opcion{transition:none}}

@media (max-width:820px){
  .bloques{grid-template-columns:repeat(2,minmax(0,1fr))}
  .inicio,.ejercicio,.dos{grid-template-columns:1fr}
  .deseos{grid-template-columns:1fr}
  .foto{width:min(100%,300px)}
  .opciones{--n:2!important}
}

function puntua(v){
  const n=(v.name||'').toLowerCase(),l=(v.lang||'').replace('_','-');
  if(!/^es/i.test(l))return -1;
  let p=/^es-ES$/i.test(l)?40:20;
  if(/premium|mejorad|enhanced|natural|neural|online/.test(n))p+=30;
  if(/google/.test(n))p+=12;
  if(/m[oó]nica|elvira|luc[ií]a|marisol|paulina|helena|laura|dalia|ximena|esperanza/.test(n))p+=8;
  if(/eddy|flo\b|grandma|grandpa|abuel|reed|rocko|sandy|shelley|bad news|bells|boing|bubbles|cellos|jester|organ|superstar|trinoids|whisper|wobble|zarvox|albert|fred|junior|ralph|kathy|good news|bahh|hysterical/.test(n))p-=80;
  return p;
}
function cargaVoces(){try{vocesES=speechSynthesis.getVoices().filter(v=>puntua(v)>=0).sort((a,b)=>puntua(b)-puntua(a))}catch(e){vocesES=[]}}

  const b=document.querySelector('.escuchar');if(b)b.classList.add('sonando');
  let k=0;
  const sigue=()=>{
    if(mio!==turno||k>=partes.length){if(b)b.classList.remove('sonando');return}
    try{const u=new SpeechSynthesisUtterance(partes[k++]);const v=vozElegida();
      u.lang=v?v.lang:'es-ES';if(v)u.voice=v;u.rate=vel||VELOCIDADES[S.velocidad]||.84;u.pitch=1;
      u.onend=()=>setTimeout(sigue,320);u.onerror=()=>setTimeout(sigue,0);speechSynthesis.speak(u)}catch(e){}

}

const baraja=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

  listo.then(()=>{

    const img=tinta.firstChild,dur=1400,t0=performance.now();
    const paso=now=>{
      const t=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-t,2.6),esc=.05+e*3.45;

      img.style.transform='scale('+esc.toFixed(4)+')';

/* Sílabas aproximadas en español, para las pistas de palabras nuevas */
function silabas(w){
  const V='aeiouáéíóúü',fuerte='aeoáéíóú',ins=['pl','pr','bl','br','cl','cr','dr','fl','fr','gl','gr','tr','ch','ll','rr','tl'];
  const t=w.toLowerCase(),g=[];let i=0;
  while(i<t.length){if(V.includes(t[i])){let j=i+1;while(j<t.length&&V.includes(t[j])&&!(fuerte.includes(t[j])&&fuerte.includes(t[j-1])))j++;g.push([i,j]);i=j}else i++}
  if(g.length<2)return[w];
  const cortes=[];
  for(let k=0;k<g.length-1;k++){const a=g[k][1],b=g[k+1][0],c=t.slice(a,b),n=c.length;let cut;
    if(n===0)cut=a;else if(n===1)cut=a;else if(n===2)cut=ins.includes(c)?a:a+1;else if(n===3)cut=ins.includes(c.slice(1))?a+1:a+2;else cut=a+2;cortes.push(cut)}
  const out=[];let prev=0;cortes.forEach(c=>{out.push(w.slice(prev,c));prev=c});out.push(w.slice(prev));return out.filter(Boolean);
}

/* ---------- nido: hilos sobre la acuarela ---------- */
function rnd(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const COL={rama:'#8a6a48','rama-clara':'#b39572',cafe:'#34466a',maria:'#cf9470'};
function dibujaNido(cv,lista,nuevos,prog){
  const r=cv.getBoundingClientRect();const W=Math.max(320,r.width),H=W*893/1600,dpr=window.devicePixelRatio||1;
  cv.width=W*dpr;cv.height=H*dpr;const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);
  const cx=W*.5,cy=H*.47,rx=W*.205,ry=H*.17;c.lineCap='round';
  const n=Math.min(lista.length,180);
  for(let i=0;i<n;i++){
    const nuevo=i>=lista.length-(nuevos||0);
    let p=1;if(nuevo&&prog!==undefined){p=Math.max(0,Math.min(1,prog*(nuevos)-(i-(lista.length-nuevos))))}
    if(p<=0)continue;
    const R=rnd(i*9973+17);const atras=i%3===2;
    let a1,a2,cy2;
    if(atras){a1=Math.PI*(1.06+.4*R());a2=Math.PI*(1.54+.4*R());cy2=cy-ry*(.8+.4*R())}
    else{a1=Math.PI*(.04+.42*R());a2=Math.PI*(.54+.42*R());cy2=cy+ry*(1.05+.6*R())}
    const k1=.9+.25*R(),k2=.9+.25*R(),cxp=cx+(R()-.5)*rx*.8;
    const x0=cx+rx*Math.cos(a1)*k1,y0=cy+ry*Math.sin(a1)*k1,x2=cx+rx*Math.cos(a2)*k2,y2=cy+ry*Math.sin(a2)*k2;
    c.strokeStyle=COL[lista[i]]||(deseo(lista[i])||{}).color||COL.rama;c.globalAlpha=atras?.6:.95;c.lineWidth=(2.2+R()*2.4)*(W/700)*(nuevo?1.25:1);
    c.beginPath();c.moveTo(x0,y0);
    const pasos=24,m=Math.round(pasos*p);
    for(let s=1;s<=m;s++){const t=s/pasos,mt=1-t;c.lineTo(mt*mt*x0+2*mt*t*cxp+t*t*x2,mt*mt*y0+2*mt*t*cy2+t*t*y2)}
    c.stroke();
  }
  c.globalAlpha=1;
}
function montaNidos(nuevos){

function silabasPara(it){
  const ult=it.s[it.s.length-1];
  const otras=baraja(PALABRAS.filter(p=>p.s.length>1&&p.s[p.s.length-1]!==ult).map(p=>p.s[p.s.length-1])).filter((v,i,a)=>a.indexOf(v)===i).slice(0,2);
  return baraja([ult].concat(otras));
}

function cabecera(){
  const pts=ses.items.map((_,k)=>{const r=ses.res[k];return`<li class="${r==='bien'?'hecho':r==='ayuda'?'ayuda':''} ${k===ses.i?'actual':''}"></li>`}).join('');
  return`<div class="barra">
    <button class="txt-btn" data-a="salir">${I.atras} Salir</button>
    <div class="puntos"><ol aria-label="Ejercicio ${ses.i+1} de ${ses.items.length}">${pts}</ol><span>${ses.i+1} de ${ses.items.length}</span></div>
    ${(()=>{const bl=BLOQUES.find(x=>x.id===ses.it.b);return`<span class="chip bloque-${bl.id}" style="background:var(--w0);color:var(--ic)">${bl.ico}${bl.nombre}</span>`})()}</div>`;
}
function pEjercicio(){
  if(ses.it.tipo!=='nombrar')return pGen();
  const it=ses.it,f=ses.fase;
  const ok=f==='bien'||f==='juntos';
  let linoImg=M.bienvenida,linoAlt='Lino te mira';
  if(['pista1','opciones','juntos'].includes(f)&&ses.ayuda){linoImg=M.pista;linoAlt='Lino guiña el ojo junto a un sobrecito'}
  if(f==='bien'){linoImg=M.palabra;linoAlt='Lino se lleva la palabra en el pico'}
  let izq,der='';
  const fotoHTML=`<div class="foto ${f==='bien'?'acierto':''}" role="img" aria-label="Foto: ${esc(it.w)}">${imagen(it)}${f==='bien'?`<span class="marca-ok">${I.ok}</span>`:''}${notaImagen(it)}</div>`;
  izq=fotoHTML;
  const enun={elige:`¿Dónde está ${art(it.w)}?`,nombra:'¿Qué es esto?',escucha:'¿Qué es esto?',confirma:'¿Te ha salido?',pista1:'¿Qué es esto?',opciones:S.nivel===3&&it.s.length>1?'Completa la palabra':'¿Cuál es?',bien:'',juntos:''}[f];
  const msg=ses.msg?`<div class="mensaje ${ses.msg.t}"><p class="titulo">${ses.msg.a}</p>${ses.msg.b?`<p>${ses.msg.b}</p>`:''}</div>`:'';
  if(S.nivel===1&&(f==='elige'||f==='bien'||f==='juntos')){
    if(!ses.opc)ses.opc=opcionesPara(it,2);
    izq=`<div class="lado"><img class="ilus lino-mini ${f==='bien'?'hop':''}" src="${linoImg}" alt="${linoAlt}" style="height:240px;max-width:90%">${msg}</div>`;
    der=`<div class="lado">${f==='elige'?`<div class="pregunta"><h2>${enun}</h2><button class="escuchar" data-a="oir" aria-label="Escuchar otra vez">${I.alt}</button></div>`:''}
      <div class="opciones" style="--n:2">${ses.opc.map(o=>`<button class="opcion ${ok&&o.w===it.w?'ok':''} ${ok&&o.w!==it.w?'fuera':''}" data-a="elige" data-w="${o.w}" ${ok?'disabled':''} aria-label="${esc(o.w)}">${imagen(o,'fotocasa mini')}</button>`).join('')}</div>
      ${f==='juntos'?`<p class="palabra-grande">${May(it.w)}</p><div class="fila"><button class="escuchar" data-a="oirpal" aria-label="Escuchar la palabra">${I.alt}</button><button class="boton primario" data-a="seguir">Seguir ${I.sigue}</button></div>`:''}
      ${f==='bien'?`<button class="boton primario grande" data-a="seguir">Seguir ${I.sigue}</button>`:''}</div>`;
  }else{
    let ctl='';
    if(f==='nombra'||f==='escucha'||f==='pista1'){
      ctl=`<div class="voz ${f==='escucha'?'escuchando':''}"><button class="voz-btn" data-a="mic" aria-label="${f==='escucha'?'Te escucho':'Responder hablando'}">${I.mic}</button>
        <span class="voz-rotulo">${f==='escucha'?'Te escucho…':'Toca y di la palabra'}</span><span class="ayuda">Sin prisa</span></div>
        ${f!=='escucha'?`<button class="boton secundario" data-a="alternativa">${S.nivel===3&&it.s.length>1?'Prefiero escribir':'Prefiero elegir'}</button>`:''}`;
    }
    if(f==='pista1')ctl=`<div class="pista"><span class="pasos" aria-label="Pista 1 de 3"><i class="si"></i><i></i><i></i></span><span>Empieza por…</span><b>${(it.s.length>1?it.s[0]:it.w.slice(0,1)).toUpperCase()}…</b><button class="escuchar" data-a="oirpista" aria-label="Escuchar la pista">${I.alt}</button></div>`+ctl;
    if(f==='confirma')ctl=`<div class="fila"><button class="boton primario" data-a="dicho">Sí, lo he dicho</button><button class="boton secundario" data-a="nosale">No me sale</button></div>
        <p class="nota">${notaVoz()}</p>`;
    if(f==='opciones'){
      if(S.nivel===3&&it.s.length>1){
        if(!ses.opc)ses.opc=silabasPara(it);
        ctl=`<p class="completar" aria-label="${it.s.slice(0,-1).join('')} y falta el final">${it.s.slice(0,-1).join('').toUpperCase()}<u>&nbsp;</u></p>
          <div class="opciones" style="--n:3">${ses.opc.map(s=>`<button class="opcion ${ses.descartes.includes(s)?'fuera':''}" data-a="silaba" data-s="${s}" ${ses.descartes.includes(s)?'disabled':''}>${s.toUpperCase()}</button>`).join('')}</div>`;
      }else{
        if(!ses.opc)ses.opc=opcionesPara(it,3);
        ctl=`<div class="opciones" style="--n:3">${ses.opc.map(o=>`<button class="opcion ${ses.descartes.includes(o.w)?'fuera':''}" data-a="elige" data-w="${o.w}" ${ses.descartes.includes(o.w)?'disabled':''}>${May(o.w)}</button>`).join('')}</div>`;
      }
    }
    if(f==='juntos')ctl=`<p class="palabra-grande">${May(it.w)}</p><div class="fila"><button class="escuchar" data-a="oirpal" aria-label="Escuchar la palabra">${I.alt}</button><button class="boton primario" data-a="seguir">Seguir ${I.sigue}</button></div>`;
    if(f==='bien')ctl=`<p class="palabra-grande">${May(it.w)}</p><button class="boton primario grande" data-a="seguir">Seguir ${I.sigue}</button>`;
    der=`<div class="lado"><img class="ilus lino-mini ${f==='bien'?'hop':''}" src="${linoImg}" alt="${linoAlt}">
      ${msg}${enun&&f!=='confirma'?`<div class="pregunta"><h2>${enun}</h2><button class="escuchar" data-a="oir" aria-label="Escuchar la pregunta">${I.alt}</button></div>`:''}
      ${f==='confirma'?`<div class="pregunta"><h2>${enun}</h2></div>`:''}${ctl}</div>`;
  }
  pinta(`<section class="pantalla">${cabecera()}<div class="ejercicio">${izq}${der}</div></section>`);
}
function art(w){if(/^[A-ZÁÉÍÓÚÑ]/.test(w))return w;if(!PALABRAS.some(p=>p.w===w))return(/a$/.test(w)?'la ':'el ')+w;const fem=['leche','cuchara','llave','manzana','silla'].includes(w);const pl=w==='gafas';return(pl?'las ':fem?'la ':'el ')+w}
function lee(){
  if(ses.it.tipo!=='nombrar')return leeGen();
  const it=ses.it,f=ses.fase;
  if(f==='elige')di(`¿Dónde está ${art(it.w)}?`);
  else if(f==='nombra')di('¿Qué es esto?');
  else if(f==='pista1')di((ses.msg?ses.msg.voz+' ':'')+'Empieza por '+(it.s.length>1?it.s[0]:it.w.slice(0,1)));
  else if(f==='opciones')di((ses.msg&&ses.msg.voz?ses.msg.voz+' ':'')+(S.nivel===3&&it.s.length>1?'Completa la palabra.':'¿Cuál es? '+ses.opc.map(o=>o.w).join(', ')));
  else if(f==='juntos')di(ses.msg.voz);
  else if(f==='bien')di(ses.msg.voz);
}
function fase(f,msg,mancha){
  ses.fase=f;ses.msg=msg||null;
  const go=()=>{render();lee()};
  mancha?transicion(mancha,go):go();
}
function acierto(){
  const it=ses.it;aciertosNombre++;
  const conNombre=aciertosNombre%3===1;
  ses.res[ses.i]=ses.ayuda?'ayuda':'bien';ses.vueltas.push(it.tipo==='nombrar'?it.w:etiqueta(it));
  S.hilos.push(it.d||((S.hilos.length%3)?'rama':'rama-clara'));ses.nuevos++;
  const nueva=it.tipo==='nombrar'&&it.d&&!S.logradas[it.w];if(it.tipo==='nombrar'&&it.d)S.logradas[it.w]=true;
  if(!S.dias.includes(hoyISO()))S.dias.push(hoyISO());
  guarda();
  const t=['Eso es','Así se dice','Muy bien'][aciertosNombre%3];
  const a=conNombre?`${t}, ${esc(S.nombre)}`:t;
  ses.paraMeta=nueva?it:null;
  if(it.tipo!=='nombrar'){const fr=it.tipo==='repite'?'Un hilo más para tu nido.':it.x;
    return fase('bien',{t:'bien',a,b:fr+(it.tipo==='repite'?'':' Un hilo más para tu nido.'),voz:`${conNombre?t+', '+S.nombre:t}. ${fr}`})}
  fase('bien',{t:'bien',a,b:`«${May(it.w)}» ya vuelve al nido.`,voz:`${conNombre?t+', '+S.nombre:t}. ${May(it.w)} ya vuelve al nido.`});
}
function juntos(){
  ses.res[ses.i]='ayuda';
  fase('juntos',{t:'juntos',a:`Es «${ses.it.w}»`,b:'Vamos a decirlo juntos. La próxima vez saldrá.',voz:`Es ${ses.it.w}. Vamos a decirlo juntos: ${ses.it.w}.`});
}

/* ---- bloques Relacionar, Hacer frases y Atención y más ---- */
function etiqueta(it){if(it.tipo==='repite')return it.t.toLowerCase();if(it.tipo==='ordena')return it.seq.join(' ');const o=it.o[it.ok][1];return it.f?it.f[0]+' '+o+' '+it.f[1]:o}
function pGen(){
  const it=ses.it,f=ses.fase,fin=f==='bien'||f==='juntos';
  let linoImg=M.bienvenida,linoAlt='Lino te mira';
  if(ses.ayuda&&f!=='bien'){linoImg=M.pista;linoAlt='Lino guiña el ojo junto a un sobrecito'}
  if(f==='bien'){linoImg=M.palabra;linoAlt='Lino se lleva la palabra en el pico'}
  const msg=ses.msg?`<div class="mensaje ${ses.msg.t}"><p class="titulo">${ses.msg.a}</p>${ses.msg.b?`<p>${ses.msg.b}</p>`:''}</div>`:'';
  const oirBtn=`<button class="escuchar" data-a="oir" aria-label="Escuchar otra vez">${I.alt}</button>`;
  const seguir=fin?`<button class="boton primario grande" data-a="seguir">Seguir ${I.sigue}</button>`:'';
  let estimulo='';
  if(it.tipo==='repite')estimulo=`<div class="foto ${f==='bien'?'acierto':''}"><span class="repite">${it.t}</span>${f==='bien'?`<span class="marca-ok">${I.ok}</span>`:''}<span class="provisional">Escucha y repite</span></div>`;
  else if(it.show)estimulo=`<div class="foto ${f==='bien'?'acierto':''}" role="img" aria-label="${it.txt?it.show:'Imagen'}">${it.txt?`<span class="repite">${it.show}</span>`:`<span class="emo">${it.show}</span>`}${f==='bien'?`<span class="marca-ok">${I.ok}</span>`:''}</div>`;
  let ctl='';
  if(it.tipo==='elige'){
    const imgs=it.o.some(o=>o[0]);const n=it.grid?3:Math.min(it.o.length,imgs?4:3);
    const largas=!imgs&&it.o.some(o=>o[1].length>14);
    const hueco=it.f?`<p class="frase-hueco">${it.f[0]} <u>${fin?it.o[it.ok][1]:'&nbsp;'}</u>${it.f[1]==='.'?'.':' '+it.f[1]}</p>`:'';
    ctl=hueco+`<div class="opciones ${largas?'una':''}" style="--n:${largas?1:n}">${it.o.map((o,k)=>{
      const cls=(fin&&k===it.ok?'ok':'')+' '+((fin&&k!==it.ok)||ses.descartes.includes(k)?'fuera':'')+(imgs?'':' txt');
      return`<button class="opcion ${cls}" data-a="gelige" data-i="${k}" ${fin||ses.descartes.includes(k)?'disabled':''} aria-label="${o[1]}">${o[0]?`<span class="emo">${o[0]}</span><span class="lbl">${o[1]}</span>`:May(o[1])}</button>`}).join('')}</div>`;
  }
  if(it.tipo==='ordena'){
    const huecos=it.seq.map((_,k)=>{const c=fin?{t:it.seq[k]}:ses.colocadas[k];return c?`<button class="ficha ${fin?'ok':''}" data-a="quita" data-i="${k}" ${fin?'disabled':''}>${c.t}</button>`:'<span class="hueco"></span>'}).join(it.pasos?'<span class="flecha" aria-hidden="true">→</span>':'');
    const usadas=ses.colocadas.map(c=>c.k);
    ctl=`<div class="huecos ${it.pasos?'pasos':''}" aria-label="Tu respuesta">${huecos}</div>`+
      (fin?'':`<div class="fichas">${ses.fichas.filter(x=>!usadas.includes(x.k)).map(x=>`<button class="ficha" data-a="ficha" data-k="${x.k}">${x.t}</button>`).join('')}</div>
      <button class="boton primario" data-a="comprobar" ${ses.colocadas.length===it.seq.length?'':'disabled'}>Comprobar</button>`);
  }
  if(it.tipo==='repite'){
    if(f==='pregunta'||f==='escucha'||f==='pista1')ctl=(f==='pista1'?`<div class="pista"><span class="pasos" aria-label="Pista"><i class="si"></i><i class="si"></i><i></i></span><span>Despacio:</span><b style="font-size:32px">${it.sil}</b><button class="escuchar" data-a="oirlento" aria-label="Escuchar despacio">${I.alt}</button></div>`:'')+
      `<div class="voz ${f==='escucha'?'escuchando':''}"><button class="voz-btn" data-a="mic" aria-label="${f==='escucha'?'Te escucho':'Repetir hablando'}">${I.mic}</button><span class="voz-rotulo">${f==='escucha'?'Te escucho…':'Toca y repite'}</span><span class="ayuda">Sin prisa</span></div>`;
    if(f==='confirma')ctl=`<div class="fila"><button class="boton primario" data-a="dicho">Sí, lo he dicho</button><button class="boton secundario" data-a="nosale">No me sale</button></div><p class="nota">${notaVoz()}</p>`;
    if(f==='juntos')ctl=`<p class="palabra-grande">${it.t}</p><button class="escuchar" data-a="oirlento" aria-label="Escuchar despacio">${I.alt}</button>`;
  }
  const preg=it.tipo==='repite'?(f==='confirma'?'¿Te ha salido?':'Escucha y repite'):it.q;
  const lado=`${msg}${fin&&it.tipo!=='repite'?'':`<div class="pregunta"><h2>${preg}</h2>${f==='confirma'?'':oirBtn}</div>`}${ctl}${seguir}`;
  let cuerpo;
  if(estimulo)cuerpo=`<div class="ejercicio">${estimulo}<div class="lado"><img class="ilus lino-mini ${f==='bien'?'hop':''}" src="${linoImg}" alt="${linoAlt}">${lado}</div></div>`;
  else cuerpo=`<div class="ejercicio ancho"><div class="lado"><img class="ilus ${f==='bien'?'hop':''}" src="${linoImg}" alt="${linoAlt}" style="height:200px;width:auto;max-width:90%"></div><div class="lado">${lado}</div></div>`;
  pinta(`<section class="pantalla">${cabecera()}${cuerpo}</section>`);
}
function leeGen(){
  const it=ses.it,f=ses.fase,pre=ses.msg&&ses.msg.voz?ses.msg.voz+' ':'';
  if(f==='bien'||f==='juntos')return di(ses.msg.voz);
  if(it.tipo==='repite'){if(f==='pista1')return di(pre+'Escucha despacio. '+it.sil,false,.62);if(f==='pregunta')return di('Escucha y repite. '+it.t+'.');return}
  let t=pre+it.q;
  if(it.txt)t+=' '+it.show.toLowerCase()+'.';
  if(it.f)t+=' '+it.f[0]+'… '+(it.f[1]==='.'?'':it.f[1]);
  if(it.tipo==='elige'&&(S.nivel===1||it.o[0][0])&&!it.grid)t+=' '+it.o.filter((o,k)=>!ses.descartes.includes(k)).map(o=>o[1]).join(', o ')+'?';
  di(t);
}
function juntosGen(){
  const it=ses.it;ses.res[ses.i]='ayuda';
  fase('juntos',{t:'juntos',a:'Vamos juntos',b:it.tipo==='repite'?`Lo decimos a la vez: ${it.t}.`:it.x+' La próxima vez saldrá.',voz:it.tipo==='repite'?`Vamos juntos. ${it.t}.`:`Vamos juntos. ${it.x}`});
}
function casiGen(){
  const it=ses.it;ses.ayuda=true;ses.fallos++;
  if(ses.fallos>=2)return juntosGen();
  fase(ses.fase==='confirma'||ses.fase==='escucha'?'pista1':'pregunta',{t:'casi',a:'Casi',b:it.p||'Prueba otra vez.',voz:'Casi. '+(it.p||'Prueba otra vez.')},'salvia');
}
function siguiente(){
  if(!ses.reg)ses.reg={};if(!ses.reg[ses.i]){ses.reg[ses.i]=true;registra()}
  if(ses.paraMeta&&!ses.deseoVisto){ses.deseoVisto=true;return capaMeta(ses.paraMeta,siguiente)}
  ses.paraMeta=null;
  if(ses.res[ses.i]===undefined)ses.res[ses.i]='ayuda';
  ses.i++;
  if(ses.i>=ses.items.length){
    const cumplidos=S.deseos.filter(d=>d.palabras.length&&!S.cumplidos[d.id]&&hilosDeseo(d)===d.palabras.length).map(d=>d.id);
    cumplidos.forEach(k=>S.cumplidos[k]=true);guarda();ses.cumplidosHoy=cumplidos;
    return ir('final',cumplidos.length?'terracota':'durazno');
  }
  empiezaItem();ses.msg=null;render();lee();
}

function capaMeta(it,cb){
  const d=deseo(it.d);if(!d)return cb();
  const capa=document.createElement('div');capa.className='capa capa-meta';
  capa.innerHTML=`${reduce?`<img src="${M.metas}" alt="Lino vuela al nido con un hilo">`:`<video src="${M.video}" autoplay muted playsinline aria-label="Lino vuela al nido con un hilo"></video>`}
    <p class="titulo" style="font-size:30px">Lino lleva «${it.w}» a tu deseo</p>
    <p style="font-size:22px">${d.nombre}: ${hilosDeseo(it.d)} de ${d.palabras.length} palabras ya vuelven</p>
    <button class="boton primario" data-cerrar>Seguir ${I.sigue}</button>`;
  app.appendChild(capa);di(`Lino lleva ${it.w} a tu deseo: ${d.nombre}.`);
  capa.querySelector('[data-cerrar]').addEventListener('click',()=>{capa.remove();cb()});
  capa.querySelector('[data-cerrar]').focus();
}

  const n=ses.nuevos;const nd=diasSemana();
  const cumpl=ses.cumplidosHoy.map(k=>(deseo(k)||{}).nombre).filter(Boolean);
  pinta(`<section class="pantalla"><div class="dos">
    <div style="display:flex;flex-direction:column;gap:22px">
      <img class="ilus" src="${M.celebra}" alt="Lino celebra con las alas abiertas" style="width:min(300px,70%)">
      <div><h1 class="titulo saludo" style="font-size:clamp(36px,5vw,52px)">Muy bien, ${esc(S.nombre)}</h1>
      <p style="font-size:24px;margin-top:6px">${n?`Hoy has tejido <b>${n} ${n===1?'hilo':'hilos'}</b> en tu nido.`:'Hoy has practicado. Mañana, otro poco.'}</p></div>
      ${cumpl.length?`<div class="mensaje bien"><p class="titulo" style="font-size:26px">Deseo cumplido</p><p>«${cumpl.join('», «')}» ya está en tu álbum.</p></div>`:''}
      ${ses.vueltas.length?`<div style="display:flex;flex-direction:column;gap:10px"><p class="ayuda">Hoy han vuelto</p><div class="palabras">${ses.vueltas.map(w=>`<span>${w}</span>`).join('')}</div></div>`:''}
      <p class="ayuda" style="font-size:20px">Esta semana has practicado ${nd} ${nd===1?'día':'días'}.</p>
      <div class="fila" style="justify-content:flex-start"><button class="boton secundario" data-a="minido">Ver mi nido</button><button class="boton primario" data-a="terminar">Terminar</button></div>
    </div>
    <div class="tarjeta-nido" style="padding:24px">
      <div class="nido-caja"><img class="ilus" src="${M.nido}" alt=""><canvas data-nido data-nuevos="${n}" aria-label="Tu nido, con ${S.hilos.length} hilos"></canvas></div>
      <p><b style="font-size:30px">${S.hilos.length}</b> hilos · ${etapa(S.hilos.length)}</p>
    </div></div></section>`,()=>{montaNidos();di(`Muy bien, ${S.nombre}. ${n?`Hoy has tejido ${n} hilos en tu nido.`:''}${cumpl.length?' Has cumplido un deseo: '+cumpl.join(' y ')+'.':''}`)});
}

function pNido(){
  pinta(`<section class="pantalla">
    <div class="barra"><button class="txt-btn" data-a="volver">${I.atras} Inicio</button><h1 class="titulo" style="font-size:clamp(30px,4vw,40px)">Mi nido</h1><span style="width:96px"></span></div>
    <div class="dos" style="flex:0">
      <div class="nido-caja"><img class="ilus" src="${M.nido}" alt=""><canvas data-nido aria-label="Tu nido, con ${S.hilos.length} hilos"></canvas></div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <p class="titulo" style="font-size:30px">Tu nido, ${esc(S.nombre)}</p>
        <p><b style="font-size:32px">${S.hilos.length}</b> hilos tejidos · ${etapa(S.hilos.length)}</p>
        <p class="ayuda">Cada palabra que vuelve es un hilo. Lino lo trae del color de su deseo.</p>
        <ul class="leyenda">${S.deseos.map(d=>`<li><i style="background:${d.color}"></i>${esc(d.nombre)}</li>`).join('')}<li><i style="background:var(--rama)"></i>Otras palabras</li></ul>
      </div>

function reduceFoto(file){

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}


/* ---------- reconocimiento de voz ----------
   Si el navegador lo permite, Lino escucha de verdad y compara con la palabra.
   Si no (por ejemplo dentro de Claude, o sin permiso), se pasa a «¿Te ha salido?». */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition||null;
let vozReal=null,rec=null;
const norm=t=>String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zñ0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function dist(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let v=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){let prev=v[0];v[0]=i;for(let j=1;j<=n;j++){const t=v[j];v[j]=Math.min(v[j]+1,v[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=t}}return v[n]}
function palabraParecida(dicha,obj){const tol=obj.length<=4?1:obj.length<=7?2:3;return dicha.split(' ').some(x=>x===obj||dist(x,obj)<=tol)}
function coincide(alternativas,objetivo){
  const o=norm(objetivo).split(' ').filter(Boolean);
  return alternativas.some(alt=>{const d=norm(alt);if(!d)return false;
    const hechos=o.filter(w=>palabraParecida(d,w)).length;return o.length===1?hechos===1:hechos/o.length>=.6});
}
function notaVoz(){return SR?'Aquí no se puede usar el micrófono. Ábrela desde su dirección web para que Lino te escuche de verdad. Mientras, nos lo cuentas tú.':'Este navegador no reconoce la voz. Nos lo cuentas tú.'}
function noSale(){
  const it=ses.it;
  if(it.tipo==='repite')return casiGen();
  if(ses.prev==='nombra'){ses.ayuda=true;return fase('pista1',{t:'casi',a:'Casi',b:'Probemos juntos.',voz:'Casi. Probemos juntos.'},'salvia')}
  ses.ayuda=true;return fase('opciones',{t:'casi',a:'Una pista más',b:'Elige la que es.',voz:'Una pista más.'});
}
function noTeOigo(){
  ses.fase=ses.prev;ses.msg={t:'juntos',a:'No te he oído',b:'Toca el micrófono y habla cuando quieras.',voz:'No te he oído. Toca el micrófono y habla cuando quieras.'};
  render();di(ses.msg.voz);

function escuchaDeVerdad(conGrab){
  if(conGrab===undefined)conGrab=S.grabar!==false&&!grabarFalla&&!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
  const it=ses.it,objetivo=it.tipo==='repite'?it.t:it.w,mio=ses;
  let alts=[],termino=false;const grab=conGrab?empiezaGrabacion():null;
  try{
    rec=new SR();rec.lang='es-ES';rec.interimResults=false;rec.maxAlternatives=5;rec.continuous=false;
    rec.onresult=e=>{for(let i=0;i<e.results.length;i++)for(let k=0;k<e.results[i].length;k++)alts.push(e.results[i][k].transcript)};
    rec.onerror=e=>{
      if(e.error==='audio-capture'&&grab){grabarFalla=true;grab.cancela();termino=true;rec=null;clearTimeout(escuchaT);if(ses===mio&&ses.fase==='escucha')escuchaDeVerdad(false);return}
      if(e.error==='not-allowed'||e.error==='service-not-allowed'||e.error==='audio-capture'||e.error==='language-not-supported'){if(grab)grab.cancela();vozReal=false;termino=true;rec=null;clearTimeout(escuchaT);if(ses===mio&&ses.fase==='escucha')fase('confirma')}
    };
    rec.onend=()=>{
      clearTimeout(escuchaT);rec=null;
      if(termino){return}
      const sale=alts.length?coincide(alts,objetivo):null;
      if(grab)grab.para().then(blob=>{if(blob&&alts.length)guardaGrabacion({palabra:objetivo,b:it.b,ok:sale,oido:alts[0]},blob)});
      if(ses!==mio||ses.fase!=='escucha')return;
      if(!alts.length)return noTeOigo();
      vozReal=true;
      if(sale)return acierto();
      noSale();
    };
    rec.start();
    escuchaT=setTimeout(()=>{if(rec){try{rec.stop()}catch(e){}}},9000);
  }catch(e){if(grab)grab.cancela();vozReal=false;rec=null;fase('confirma')}
}

/* ---------- grabaciones de su voz (solo en este dispositivo) ---------- */
let grabarFalla=false;
function empiezaGrabacion(){
  let mr=null,stream=null,trozos=[],cancelada=false;
  const fin=()=>{if(stream)stream.getTracks().forEach(t=>t.stop())};
  const listo=navigator.mediaDevices.getUserMedia({audio:true}).then(st=>{stream=st;if(cancelada)return fin();
    const tipo=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t));
    mr=new MediaRecorder(st,tipo?{mimeType:tipo}:undefined);mr.ondataavailable=e=>{if(e.data&&e.data.size)trozos.push(e.data)};mr.start()}).catch(()=>{grabarFalla=true});
  return{
    para(){return listo.then(()=>new Promise(ok=>{if(!mr||mr.state==='inactive'){fin();return ok(null)}
      mr.onstop=()=>{fin();ok(trozos.length?new Blob(trozos,{type:mr.mimeType||'audio/mp4'}):null)};try{mr.stop()}catch(e){fin();ok(null)}}))},
    cancela(){cancelada=true;listo.then(()=>{try{if(mr&&mr.state!=='inactive')mr.stop()}catch(e){}fin()})}
  };
}
function abreDB(){return new Promise((ok,mal)=>{try{const r=indexedDB.open('nido-voz',1);r.onupgradeneeded=()=>r.result.createObjectStore('grabaciones',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>mal(r.error)}catch(e){mal(e)}})}
function guardaGrabacion(meta,blob){
  return abreDB().then(db=>new Promise(ok=>{const tx=db.transaction('grabaciones','readwrite');
    tx.objectStore('grabaciones').put(Object.assign({id:Date.now(),fecha:new Date().toISOString(),blob},meta));tx.oncomplete=ok;tx.onerror=ok})).catch(()=>{});
}
function listaGrabaciones(){return abreDB().then(db=>new Promise(ok=>{const r=db.transaction('grabaciones').objectStore('grabaciones').getAll();r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>ok([])})).catch(()=>[])}
function borraGrabaciones(){return abreDB().then(db=>new Promise(ok=>{const tx=db.transaction('grabaciones','readwrite');tx.objectStore('grabaciones').clear();tx.oncomplete=ok;tx.onerror=ok})).catch(()=>{})}

/* ---------- historial y resumen para la logopeda ---------- */
function registra(){
  const it=ses.it;if(!S.historial)S.historial=[];
  const r=ses.fase==='juntos'?'juntos':ses.res[ses.i]==='bien'?'bien':'pista';
  S.historial.push({f:hoyISO(),b:it.b,o:it.tipo==='nombrar'?it.w:etiqueta(it),r,n:S.nivel});
  if(S.historial.length>3000)S.historial=S.historial.slice(-3000);guarda();

const NOMBRE_BLOQUE={den:'Nombrar (Denominación)',sem:'Relacionar (Semántica)',sin:'Hacer frases (Sintaxis)',otr:'Atención y más (Otras capacidades)'};
function fechaCorta(iso){return new Date(iso+(iso.length===10?'T12:00':'')).toLocaleDateString('es-ES',{day:'numeric',month:'short'})}
function resumen(dias){
  const desde=new Date();desde.setDate(desde.getDate()-(dias-1));const dIso=desde.toISOString().slice(0,10);
  const h=(S.historial||[]).filter(x=>x.f>=dIso);
  const diasP=new Set(h.map(x=>x.f)).size;
  const cuenta=l=>({n:l.length,bien:l.filter(x=>x.r==='bien').length,pista:l.filter(x=>x.r==='pista').length,juntos:l.filter(x=>x.r==='juntos').length});
  const pc=(a,b)=>b?Math.round(a/b*100)+' %':'—';
  const tot=cuenta(h);
  const porBloque=['den','sem','sin','otr'].map(b=>({b,c:cuenta(h.filter(x=>x.b===b))})).filter(x=>x.c.n);
  const porObj={};h.forEach(x=>{(porObj[x.o]=porObj[x.o]||[]).push(x.r)});
  const cuestan=Object.entries(porObj).map(([o,rs])=>({o,ay:rs.filter(r=>r!=='bien').length,n:rs.length})).filter(x=>x.ay).sort((a,b)=>b.ay-a.ay||b.n-a.n).slice(0,8);
  const salen=Object.entries(porObj).filter(([o,rs])=>rs.every(r=>r==='bien')).map(([o])=>o).slice(0,15);
  const L=[];
  L.push(`Resumen de Nido · ${S.nombre}`);
  L.push(`${fechaCorta(dIso)} – ${fechaCorta(hoyISO())} (últimos ${dias} días) · Nivel: ${NIVELES[S.nivel]}`);
  L.push('');
  if(!h.length){L.push('Todavía no hay ejercicios en este periodo.');return{texto:L.join('\n'),tot,diasP,porBloque,cuestan,salen}}
  L.push(`Días de práctica: ${diasP} de ${dias}`);
  L.push(`${tot.n===1?'Ejercicio':'Ejercicios'}: ${tot.n} · a la primera ${tot.bien} (${pc(tot.bien,tot.n)}) · con pista ${tot.pista} · con ayuda completa ${tot.juntos}`);
  L.push('');L.push('Por bloque:');
  porBloque.forEach(x=>L.push(`· ${NOMBRE_BLOQUE[x.b]}: ${x.c.n} ${x.c.n===1?'ejercicio':'ejercicios'} · ${pc(x.c.bien,x.c.n)} a la primera · ${x.c.pista} con pista · ${x.c.juntos} con ayuda completa`));
  if(cuestan.length){L.push('');L.push('Lo que más cuesta (necesitó ayuda):');cuestan.forEach(x=>L.push(`· ${x.o} (${x.ay} de ${x.n} ${x.n===1?'vez':'veces'})`))}
  if(salen.length){L.push('');L.push('Sale sin ayuda: '+salen.join(', '))}
  if(S.deseos.length){L.push('');L.push('Deseos:');S.deseos.forEach(d=>L.push(`· ${d.nombre}: ${hilosDeseo(d)} de ${d.palabras.length} palabras${d.palabras.length&&hilosDeseo(d)===d.palabras.length?' · cumplido':''}`))}
  return{texto:L.join('\n'),tot,diasP,porBloque,cuestan,salen};
}
function capaProgreso(){
  const capa=document.createElement('div');capa.className='capa';app.appendChild(capa);
  let dias=7,armado=false,urls=[];
  const limpia=()=>{urls.forEach(u=>URL.revokeObjectURL(u));urls=[]};
  const pinta=async()=>{
    const R=resumen(dias);const gr=(await listaGrabaciones()).sort((a,b)=>b.id-a.id);
    limpia();
    const porPal={};gr.forEach(g=>{(porPal[g.palabra]=porPal[g.palabra]||[]).push(g)});
    const pc=(a,b)=>b?Math.round(a/b*100):0;
    capa.innerHTML=`<div class="capa-caja ancha">
      <span class="etiqueta">Espacio de la familia</span>${pestanas('progreso')}
      <div class="barra"><p class="titulo" style="font-size:30px">Progreso</p>
        <div class="pestanas" role="group" aria-label="Periodo">${[[7,'7 días'],[30,'30 días']].map(([d,l])=>`<button type="button" class="pestana ${dias===d?'activa':''}" data-dias="${d}" aria-pressed="${dias===d}">${l}</button>`).join('')}</div></div>
      ${R.tot.n?`<div class="cifras">
        <div><b>${R.diasP}</b><span>días de práctica</span></div>
        <div><b>${R.tot.n}</b><span>ejercicios</span></div>
        <div><b>${pc(R.tot.bien,R.tot.n)} %</b><span>a la primera</span></div>
        <div><b>${R.tot.pista+R.tot.juntos}</b><span>con ayuda</span></div></div>
      <div class="tabla-bloques">${R.porBloque.map(x=>`<div class="tb-fila"><span>${NOMBRE_BLOQUE[x.b]}</span>
        <span class="tb-barra" role="img" aria-label="${pc(x.c.bien,x.c.n)} % a la primera"><i style="width:${pc(x.c.bien,x.c.n)}%"></i><i class="p" style="width:${pc(x.c.pista,x.c.n)}%"></i></span>
        <span class="tb-n">${x.c.n}</span></div>`).join('')}
        <p class="ayuda" style="font-size:15px"><i class="leyenda-c"></i> a la primera <i class="leyenda-c p"></i> con pista <i class="leyenda-c j"></i> con ayuda completa</p></div>
      ${R.cuestan.length?`<p><b>Lo que más cuesta:</b> ${R.cuestan.map(x=>esc(x.o)).join(', ')}</p>`:''}`
      :'<p class="ayuda">Todavía no hay ejercicios en este periodo en esta tablet. Cuando practique, aquí aparecerá el resumen.</p>'}
      <div class="fila" style="justify-content:flex-start"><button type="button" class="boton primario" id="pr-compartir">Compartir resumen</button><button type="button" class="boton secundario" id="pr-copiar">Copiar texto</button></div>
      <p class="ayuda" id="pr-aviso" role="status" style="font-size:16px"></p>
      <details class="previa"><summary>Ver el texto que se envía</summary><pre id="pr-texto">${esc(R.texto)}</pre></details>
      <hr>
      <p class="titulo" style="font-size:26px">Su voz</p>
      ${S.grabar===false?'<p class="ayuda">Las grabaciones están desactivadas en Ajustes.</p>':''}
      ${grabarFalla?'<p class="ayuda">Este dispositivo no deja grabar mientras Lino escucha. Lino sigue reconociendo la voz, pero sin guardar la grabación.</p>':''}
      ${gr.length?Object.entries(porPal).map(([pal,l])=>`<div class="voz-pal"><b>${esc(pal)}</b><ul>${l.slice(0,6).map(g=>{const u=URL.createObjectURL(g.blob);urls.push(u);
        return`<li><span class="ayuda" style="font-size:15px">${fechaCorta(g.fecha.slice(0,10))} · ${g.ok?'salió':'con ayuda'}</span><audio controls preload="none" src="${u}"></audio></li>`}).join('')}</ul></div>`).join('')
      :'<p class="ayuda">Aún no hay grabaciones. Se guardan cuando responde hablando con el micrófono verde, desde la dirección web de la app.</p>'}
      <div class="fila" style="justify-content:space-between">${gr.length?`<button type="button" class="txt-btn" id="pr-borrar">${armado?'Toca otra vez para borrar todas':'Borrar grabaciones'}</button>`:'<span></span>'}<button type="button" class="boton secundario" data-cerrar>Cerrar</button></div>
    </div>`;
    conectaPestanas(capa);
    capa.querySelectorAll('[data-dias]').forEach(b=>b.addEventListener('click',()=>{dias=+b.dataset.dias;pinta()}));
    capa.querySelector('[data-cerrar]').addEventListener('click',()=>{limpia();capa.remove()});
    const aviso=t=>{capa.querySelector('#pr-aviso').textContent=t};
    const copiar=()=>navigator.clipboard.writeText(R.texto).then(()=>aviso('Resumen copiado. Pégalo en WhatsApp o en un correo.')).catch(()=>{const d=capa.querySelector('details');d.open=true;const r=document.createRange();r.selectNodeContents(capa.querySelector('#pr-texto'));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);aviso('Texto seleccionado: cópialo con el menú del sistema.')});
    capa.querySelector('#pr-copiar').addEventListener('click',copiar);
    capa.querySelector('#pr-compartir').addEventListener('click',()=>{
      if(navigator.share)navigator.share({title:'Resumen de Nido · '+S.nombre,text:R.texto}).then(()=>aviso('Resumen compartido.')).catch(e=>{if(e&&e.name==='AbortError')return;copiar()});
      else copiar();
    });
    const bb=capa.querySelector('#pr-borrar');if(bb)bb.addEventListener('click',()=>{if(!armado){armado=true;return pinta()}armado=false;borraGrabaciones().then(pinta)});
  };
  pinta();
}
/* ---------- acciones ---------- */
let escuchaT=null;
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='entrar'){return transicion('durazno',()=>{vista='inicio';render();di(`Hola, ${S.nombre}. Palabras que vuelven a ti.`)})}
  if(a==='familia')return capaFamilia();
  if(a==='editar-deseos')return capaFamilia('deseos');
  if(a==='bloque'){const bl=BLOQUES.find(x=>x.id===b.dataset.b);if(bl.listo){nuevaSesion(bl.id);return transicion('durazno',()=>{vista='ejercicio';render();lee()})}return capaPronto(bl)}
  if(a==='practicar'){nuevaSesion();return transicion('durazno',()=>{vista='ejercicio';render();lee()})}
  if(a==='minido')return ir('nido','durazno');
  if(a==='volver'||a==='terminar')return ir('inicio');
  if(a==='salir'){clearTimeout(escuchaT);if(rec){try{rec.abort()}catch(e){}rec=null}return ir('inicio')}
  if(!ses)return;
  const it=ses.it;
  if(a==='oir')return lee();
  if(a==='oirpal')return di(it.w,true);
  if(a==='oirpista')return di('Empieza por '+(it.s.length>1?it.s[0]:it.w.slice(0,1)),true);
  if(a==='oirlento')return di(it.sil||it.t,true,.62);
  if(a==='gelige'){const k=+b.dataset.i;if(k===it.ok)return acierto();ses.descartes.push(k);return casiGen()}
  if(a==='ficha'){const k=+b.dataset.k;ses.colocadas.push(ses.fichas.find(x=>x.k===k));render();return di(it.seq[k],true)}
  if(a==='quita'){ses.colocadas.splice(+b.dataset.i,1);return render()}
  if(a==='comprobar'){
    if(ses.colocadas.every((c,k)=>c.k===k))return acierto();
    let pref=0;while(pref<ses.colocadas.length&&ses.colocadas[pref].k===pref)pref++;
    ses.colocadas=ses.colocadas.slice(0,pref);return casiGen();
  }
  if(a==='mic'){
    if(ses.fase==='escucha'){clearTimeout(escuchaT);if(rec){try{rec.stop()}catch(e){}return}return fase('confirma')}
    ses.prev=ses.fase;calla();ses.fase='escucha';ses.msg=null;render();
    if(SR&&vozReal!==false)return escuchaDeVerdad();
    escuchaT=setTimeout(()=>{if(ses.fase==='escucha')fase('confirma')},3200);return;
  }
  if(a==='dicho')return acierto();
  if(a==='nosale')return noSale();
  if(a==='alternativa'){return fase('opciones',ses.fase==='pista1'?ses.msg:null)}
  if(a==='elige'){
    const w=b.dataset.w;
    if(w===it.w)return acierto();
    if(S.nivel===1){ses.ayuda=true;return fase('juntos',{t:'juntos',a:`Es «${it.w}»`,b:'Vamos a decirlo juntos.',voz:`Es ${it.w}. Vamos a decirlo juntos: ${it.w}.`},'salvia')}
    ses.descartes.push(w);ses.ayuda=true;
    if(!ses.msg||ses.msg.t!=='casi')return fase('opciones',{t:'casi',a:'Casi',b:'Prueba con otra.',voz:'Casi. Prueba con otra.'},'salvia');
    return juntos();
  }
  if(a==='silaba'){
    const s=b.dataset.s;
    if(s===it.s[it.s.length-1])return acierto();
    ses.descartes.push(s);ses.ayuda=true;
    if(!ses.msg||ses.msg.t!=='casi')return fase('opciones',{t:'casi',a:'Casi',b:'Prueba con otra.',voz:'Casi. Prueba con otra.'},'salvia');
    return juntos();
  }
  if(a==='seguir')return siguiente();
});

render();
})();
